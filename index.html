<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation Card</title>
    <style>
        :root {
            --primary: #fff;
            --bg-color: rgb(5, 53, 61);
            --bg-envelope-color: #f5edd1;
            --envelope-tab: #ecdeb8;
            --envelope-cover: #e6cfa7;
            --shadow-color: rgba(0, 0, 0, 0.2);
            --txt-color: #444;
            --heart-color: rgb(252, 8, 231);
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .container {
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .envelope-wrapper {
            background: var(--bg-envelope-color);
            box-shadow: 0 0 40px var(--shadow-color);
            position: relative;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 230px;
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            z-index: 2;
            border-top: 130px solid var(--envelope-tab);
            border-right: 150px solid transparent;
            border-left: 150px solid transparent;
            transform-origin: top;
            transition: all 0.5s ease-in-out 0.7s;
        }

        .envelope::after {
            content: "";
            position: absolute;
            z-index: 2;
            width: 0px;
            height: 0px;
            border-top: 130px solid transparent;
            border-right: 150px solid var(--envelope-cover);
            border-bottom: 100px solid var(--envelope-cover);
            border-left: 150px solid var(--envelope-cover);
        }

        .letter {
            position: absolute;
            right: 20%;
            bottom: 0;
            width: 54%;
            height: 80%;
            background: var(--primary);
            text-align: center;
            transition: all 1s ease-in-out;
            box-shadow: 0 0 5px var(--shadow-color);
            padding: 20px 10px;
            border: 3px dashed #3b64eb;
        }

        .letter .text {
            color: var(--txt-color);
            text-align: left;
            font-size: 10px;
        }

        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 15px;
            height: 15px;
            background: var(--heart-color);
            z-index: 4;
            transform: translate(-50%, -20%) rotate(45deg);
            transition: transform 0.5s ease-in-out 1s;
            box-shadow: 0 1px 6px var(--shadow-color);
            cursor: pointer;
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: var(--heart-color);
            border-radius: 50%;
        }

        .heart:before {
            top: -7.5px;
        }

        .heart:after {
            right: 7.5px;
        }

        .flap .envelope::before {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .flap .envelope .letter {
            bottom: 100px;
            transform: scale(1.5);
            transition-delay: 1s;
        }

        .flap .heart {
            transform: rotate(90deg);
            transition-delay: 0.4s;
        }

        @media (max-width: 600px) {
            .letter .text {
                font-size: 9px;
            }

            .heart {
                top: 55%;
            }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: linear-gradient(135deg, #d0e6f7, #f5d3f7);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px #00000033;
            text-align: center;
            animation: popin 0.3s ease;
        }

        @keyframes popin {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal h2 {
            margin-bottom: 15px;
            color: #222;
        }

        .modal input {
            padding: 10px;
            width: 100%;
            margin-bottom: 15px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .modal button {
            padding: 10px 20px;
            background: #2c84c5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal button:hover {
            background: #20689e;
        }

        /* Burn animation */
        @keyframes burn {
            0% {
                filter: brightness(1);
                transform: rotate(0deg) scale(1);
            }

            50% {
                filter: brightness(1.5) hue-rotate(-30deg) saturate(2);
                transform: rotate(1deg) scale(1.03);
            }

            100% {
                opacity: 0;
                transform: rotate(-1deg) scale(1.1);
            }
        }

        .burning {
            animation: burn 2.5s forwards;
            pointer-events: none;
        }

        .burning .letter {
            transition: none !important;
            transform: none !important;
            bottom: 0 !important;
        }
    </style>
</head>

<body>
    <div class="modal-overlay">
        <div class="modal">
            <h2>Enter Your Class Roll Number</h2>
            <input type="number" id="roll-input" placeholder="e.g. 1, 02, 10" min="1"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                onkeydown="if(event.key === '-' || event.key === 'e'){ event.preventDefault(); }"
                onwheel="this.blur()" />
            <button id="submit-roll">Submit</button>
        </div>
    </div>

    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong><u id="person-name">Dear Person.</u></strong>
                        <p>We are pleased to invite you to join us,<br />
                            on <b>16 April 2025, 1:30 PM</b><br />
                            for the <b>#include &lt;2K24&gt;</b> event<br />
                            At room <b>206</b>,<br />
                            <b>University of Calcutta, Technology Campus.</b><br /><br />
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<u>Dress
                                Code:</u>&nbsp;&nbsp;<b>Ethnic</b>
                        </p>
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
    </div>

    <script>
        const classRoll = {
            "1": "Samrat Dutta", "2": "Shashwata Mukherjee", "3": "Debasmita Pal",
            "4": "Aishani Roy", "5": "Saptarshi Mondal", "6": "Agnish Banerjee",
            "7": "Vijoya Guha Thakurta", "8": "Ayan Koley", "9": "Soham Das",
            "10": "Ayush Kumar Shukla", "11": "Debottam Kar", "12": "Sudip Roy",
            "13": "Tanmoy Das", "14": "Subhra Pratim Mondal", "15": "Sayantan Show",
            "16": "Roni Dey", "17": "Silly Goose", "18": "Soumodeep Karmakar",
            "19": "Pritam Mondal", "20": "Sreena Mondal", "21": "Bipasha Mondal",
            "22": "Aritra Mazumdar", "23": "Ishika Das", "24": "Swarup Naskar",
            "25": "Sk kaif Rahaman", "26": "Sreya Chandra", "27": "SAYAK ACHARYA",
            "28": "Anjali Jha", "29": "Debjit Roy", "30": "Saumendra halder",
            "31": "Priyam Bhattacharya", "32": "Tulika Jana", "33": "Sandip Singha",
            "34": "Sarthak Biswas", "35": "Abaidullah Seikh"
        };

        document.getElementById("submit-roll").addEventListener("click", (event) => {
            event.preventDefault();
            const input = document.getElementById("roll-input").value.trim();
            const rollNumber = input.replace(/^0+/, '');
            const personNameElement = document.getElementById("person-name");

            if (classRoll[rollNumber]) {
                personNameElement.textContent = `Dear ${classRoll[rollNumber]}.`;
                document.querySelector(".modal-overlay").style.display = "none";

            } else {
                alert('Oh! An imposter! You won\'t get anything.')
                document.querySelector(".modal-overlay").style.display = "none";
                document.getElementById("roll-input").value = "";

                const envelopeWrapper = document.querySelector(".envelope-wrapper");

                envelopeWrapper.classList.remove("flap");
                envelopeWrapper.classList.add("burning");

                setTimeout(() => {
                    envelopeWrapper.classList.remove("burning");
                    alert('I told you.')
                    location.reload();
                }, 2700);
            }
        });

        document.querySelector('.envelope-wrapper').addEventListener('click', function () {
            this.classList.toggle('flap');
        });
    </script>
</body>

</html>
